<div class="min-h-dvh flex flex-col">
  <header class="sticky top-0 z-30 border-b border-[var(--color-border)] bg-[var(--color-surface)]">
    <div class="mx-auto max-w-6xl px-5 sm:px-8 py-4 flex items-center gap-2.5">
      <span class="flex h-7 w-7 items-center justify-center rounded-full bg-[var(--color-ink)] text-[var(--color-accent)]" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M9.2.6c.3.1.5.4.4.8L8.1 7h4.4c.3 0 .6.2.7.5.1.3 0 .6-.2.8l-7 7.1c-.3.3-.7.3-1 .1-.3-.2-.4-.5-.3-.9L6.2 9H1.9c-.3 0-.6-.2-.7-.5-.1-.3 0-.6.2-.8L8.4.6c.2-.2.5-.2.8 0Z" />
        </svg>
      </span>
      <span class="font-display font-extrabold text-lg tracking-tight">
        Volt Index
      </span>
      <span class="hidden sm:inline text-sm text-[var(--color-ink-muted)] ml-1 pl-2.5 border-l border-[var(--color-border)]">
        Electric cars, compared honestly
      </span>
    </div>
  </header>

  <main class="flex-1">
    @if (detailService.isOpen()) {
      <app-car-detail />
    } @else if (comparisonService.isOpen()) {
      <app-comparison />
    } @else {
      <app-car-browser />
    }
  </main>
</div>
