<div class="min-h-dvh flex flex-col">
  <header class="border-b border-[var(--color-border)] bg-[var(--color-surface)]">
    <div class="mx-auto max-w-6xl px-5 sm:px-8 py-4 flex items-center gap-3">
      <span class="h-2 w-2 rounded-full bg-[var(--color-accent)]" aria-hidden="true"></span>
      <span class="font-display font-semibold text-lg tracking-tight">
        Volt Index
      </span>
      <span class="hidden sm:inline text-sm text-[var(--color-ink-muted)] ml-1">
        Electric cars, compared honestly
      </span>
    </div>
  </header>

  <main class="flex-1">
    @if (detailService.isOpen()) {
      <app-car-detail />
    } @else if (comparisonService.isOpen()) {
      <app-comparison />
    } @else {
      <app-car-browser />
    }
  </main>
</div>
